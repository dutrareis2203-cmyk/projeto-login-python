{% extends "base.html" %}
{% block title %}Nova senha | Lanchonete{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Lanchonete</h1>
  <p class="muted">Cadastre sua nova senha</p>
  <form id="reset-form">
    <label>Nova senha</label>
    <input type="password" id="senha" placeholder="Nova senha" minlength="6" required>
    <label>Confirme sua senha</label>
    <input type="password" id="confirmar" placeholder="Confirme sua senha" minlength="6" required>
    <button class="primary full" type="submit">Salvar nova senha</button>
    <p id="mensagem" class="form-message"></p>
  </form>
  <a class="link" href="{{ url_for('login') }}">Voltar ao login</a>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("reset-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const mensagem = document.getElementById("mensagem");
  const senha = document.getElementById("senha").value;
  const confirmar = document.getElementById("confirmar").value;
  if (senha !== confirmar) {
    mensagem.textContent = "As senhas não são iguais.";
    return;
  }
  const hash = new URLSearchParams(window.location.hash.slice(1));
  const access_token = hash.get("access_token");
  const refresh_token = hash.get("refresh_token");
  if (!access_token || !refresh_token) {
    mensagem.textContent = "Link inválido ou expirado. Solicite outro link.";
    return;
  }
  mensagem.textContent = "Atualizando senha...";
  const resposta = await fetch("/api/redefinir-senha", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({access_token, refresh_token, senha})
  });
  const dados = await resposta.json();
  mensagem.textContent = dados.mensagem;
  if (dados.ok) {
    window.location.href = "/login";
  }
});
</script>
{% endblock %}
