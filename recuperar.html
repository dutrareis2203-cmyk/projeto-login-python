{% extends "base.html" %}
{% block title %}Recuperar senha | Lanchonete{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Lanchonete</h1>
  <p class="muted">Informe seu e-mail para receber o link de recuperação.</p>
  <form method="post">
    <label>E-mail</label>
    <input type="email" name="email" placeholder="Digite seu e-mail" required>
    <button class="primary full">Enviar link de recuperação</button>
  </form>
  <a class="link" href="{{ url_for('login') }}">Voltar ao login</a>
</section>
{% endblock %}
